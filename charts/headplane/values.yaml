      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi
    # -- Executed command
    cmd:
    #  - sh
    #  - -c
    #  - "sleep infinity"
    # -- Set the node selector
    nodeSelector: {}
    # -- Set list of tolerations
    tolerations: []
    # -- Set affinity rules
    affinity: {}
    # -- Set Topology Spread Constraints
    topologySpreadConstraints: []
    # -- Set a pod priorityClassName
    priorityClassName: ""
    # -- Liveness Probe
    livenessProbe:
      enabled: false
      httpGet:
        path: / 
        port: 5080
      initialDelaySeconds: 30
      periodSeconds: 10
    # -- Readiness Probe
    readinessProbe:
      enabled: false
      httpGet:
        path: / 
        port: 5080
      initialDelaySeconds: 5
      periodSeconds: 10
    # -- Extra environment variables (`key: value` style, allows templating)
    envs: {}
    # EXTRA: "value"
    # -- Additional volumeMounts on the output Deployment definition.
    volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true

