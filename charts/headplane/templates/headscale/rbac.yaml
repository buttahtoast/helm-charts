---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{$.Release.Name}}-agent
  namespace: {{ $.Release.Namespace }}
rules:
- apiGroups: ['']
  resources: ['pods']
  verbs: ['get', 'list']
- apiGroups: ['apps']
  resources: ['deployments']
  verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{$.Release.Name}}-agent
  namespace: {{ $.Release.Namespace }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{$.Release.Name}}-agent
subjects:
- kind: ServiceAccount
  name: {{$.Release.Name}}-headplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{$.Release.Name}}-token
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{$.Release.Name}}-token
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{$.Release.Name}}-token
roleRef:
  kind: Role
  name: {{$.Release.Name}}-token
  apiGroup: rbac.authorization.k8s.io